version: '3.9'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: reports_db
    restart: unless-stopped
    
    environment:
      # Variables desde .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      
      # Usuario de aplicación (para roles.sql)
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    
    volumes:
      # Persistencia de datos
      - postgres_data:/var/lib/postgresql/data
      
      # Scripts de inicialización (ejecutados en orden alfabético)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    
    ports:
      # Exponer puerto para debugging (opcional)
      - "5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - app_network

  # ============================================
  # Next.js Web Application
  # ============================================
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        NODE_ENV: ${NODE_ENV:-production}
    
    container_name: reports_web
    restart: unless-stopped
    
    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
    
    ports:
      - "3000:3000"
    
    depends_on:
      db:
        # Esperar a que DB esté HEALTHY antes de iniciar
        condition: service_healthy
    
    networks:
      - app_network
    
    # Healthcheck para la app web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================
# Volumes (Persistencia)
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# Networks (Aislamiento)
# ============================================
networks:
  app_network:
    driver: bridge